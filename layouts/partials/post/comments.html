<!-- also see https://github.com/tomfran/typo/blob/29730f00d01deff12af09458b08947554e8fcea8/layouts/partials/comments.html#L7 -->
<div class="comments">
    {{ if .Site.Params.giscus.enable -}}
    <div class="giscus"></div>
    <script
        src="https://giscus.app/client.js"
        data-repo="{{ .Site.Params.giscus.repo }}"
        data-repo-id="{{ .Site.Params.giscus.repo_id }}"
        data-category="{{ .Site.Params.giscus.category }}"
        data-category-id="{{ .Site.Params.giscus.category_id }}"
        data-mapping="{{ .Site.Params.giscus.mapping | default "pathname" }}"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="{{ .Site.Params.giscus.theme | default "preferred_color_scheme" }}"
        data-lang="{{ .Site.Language.Lang | default "en" }}"
        data-loading="lazy"
        crossorigin="anonymous"
        async
    ></script>
    {{- else if .Site.Params.remark42 }}
        <div id="remark42"></div>
        <script>
            themeFromLS = localStorage.getItem("theme")
            themeFromHugo = document.body.classList.contains("dark-theme") ? "dark" : "light"
            currentTheme = themeFromLS ? themeFromLS : themeFromHugo;

            var remark_config = {
                host: {{ site.Params.remark42_host }},
                site_id: {{ site.Params.remark42_site_id }},
                theme: currentTheme,
                max_shown_comments: 100,
            }
        </script>
        <script>!function(e,n){for(var o=0;o<e.length;o++){var r=n.createElement("script"),c=".js",d=n.head||n.body;"noModule"in r?(r.type="module",c=".mjs"):r.async=!0,r.defer=!0,r.src=remark_config.host+"/web/"+e[o]+c,d.appendChild(r)}}(remark_config.components||["embed"],document);</script>
    {{ else if .Site.Config.Services.Disqus.Shortname }}
        {{ template "_internal/disqus.html" . }}
    {{ end }}
</div>
