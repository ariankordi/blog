{{/* https://blog.builtwithcaffeine.cloud/posts/hugo-url-redirect/ */}}
{{/* https://github.com/gohugoio/hugo/blob/v0.155.3/tpl/tplimpl/embedded/templates/alias.html */}}
<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}">
  <head>
    <title>{{ .Params.target }}</title>
    {{ with .OutputFormats.Canonical }}<link rel="{{ .Rel }}" href="{{ .Permalink }}">{{ end }}
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url={{ .Params.target }}">
  </head>
</html>
